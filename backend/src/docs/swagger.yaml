    # ----------------- Módulo Archivos --------------------
  /archivos:
    get:
      tags: [Archivos]
      summary: Ver mis archivos subidos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de archivos obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /archivos/subir:
    post:
      tags: [Archivos]
      summary: Subir archivo (CV, comprobante residencia o certificado)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - archivo
                - tipo_documento
              properties:
                archivo:
                  type: string
                  format: binary
                  description: Archivo PDF, Word, JPG o PNG (máx 5MB)
                tipo_documento:
                  type: string
                  enum: [cv, comprobante_residencia, certificado]
                  example: cv
      responses:
        '201':
          description: Archivo subido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Formato no permitido o tipo inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /archivos/{id_archivo}:
    delete:
      tags: [Archivos]
      summary: Eliminar un archivo
      security:
        - bearerAuth: []
      parameters:
        - name: id_archivo
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Archivo eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Archivo no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  



  




